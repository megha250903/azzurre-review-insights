services:
  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: azzurre-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URI
        sync: false          # you'll paste the value in the Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: azzurre-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # paste: https://azzurre-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
